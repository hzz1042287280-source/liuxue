<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f8fafc">
<title>你适合去哪个国家留学？｜留学适配度测试</title>
<style>
:root{
  --navy:#1e3a8a;
  --navy-light:#3b5bc0;
  --gold:#d97706;
  --gold-light:#f59e0b;
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --card:#ffffff;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}

body{
  background:linear-gradient(160deg,#f8fafc 0%,#eff6ff 50%,#f0f9ff 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100dvh;
  -webkit-touch-callout:none;
  position:relative;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  top:-100px;right:-100px;
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(59,91,192,.18),transparent 70%);
  filter:blur(30px);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  bottom:-100px;left:-100px;
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(217,119,6,.12),transparent 70%);
  filter:blur(30px);
  pointer-events:none;
  z-index:0;
}

.wrap{
  max-width:820px;
  margin:auto;
  padding:24px 16px calc(40px + env(safe-area-inset-bottom));
  position:relative;
  z-index:1;
}

.hero{padding:44px 6px 28px;text-align:center}
.kicker{
  letter-spacing:.16em;
  font-size:11px;
  font-weight:600;
  color:var(--gold);
}
h1{
  font-size:34px;
  line-height:1.25;
  margin:14px 0 14px;
  font-weight:800;
  letter-spacing:-.02em;
  color:var(--navy);
}
.sub{color:var(--muted);line-height:1.75;font-size:15px}

.card{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 12px 40px rgba(30,58,138,.06);
  padding:24px 20px;
  margin-top:16px;
}

.btn{
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:#fff;
  padding:14px 26px;
  min-height:50px;
  font-size:16px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(30,58,138,.25);
  transition:transform .1s,box-shadow .15s;
}
.btn:disabled{opacity:.35;box-shadow:none}
.btn:active:not(:disabled){
  transform:scale(.97);
}
.btn.secondary{
  background:#fff;
  color:var(--muted);
  border:1px solid var(--line);
  box-shadow:none;
}
.btn.gold{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  box-shadow:0 8px 22px rgba(217,119,6,.28);
}

#test:not(.hidden){
  display:flex;
  flex-direction:column;
  min-height:calc(100dvh - 80px);
}
.progress{
  height:5px;
  background:#e2e8f0;
  border-radius:10px;
  overflow:hidden;
  margin:8px 0 22px;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,var(--navy),var(--gold));
  width:0;
  transition:width .3s;
}
.qnum{
  font-size:12px;
  color:var(--navy);
  font-weight:600;
  letter-spacing:.04em;
}
.question{
  font-size:20px;
  line-height:1.55;
  font-weight:700;
  margin:10px 0 22px;
  color:var(--ink);
}
#opts{flex:1}

.opt{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  text-align:left;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:16px;
  min-height:58px;
  margin:10px 0;
  font-size:15.5px;
  font-family:inherit;
  line-height:1.5;
  color:var(--ink);
  cursor:pointer;
  transition:transform .1s,border-color .15s,background .15s,box-shadow .15s;
}
.opt-key{
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:24px;height:24px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:#fff;
  font-size:12px;
  font-weight:700;
  margin-top:1px;
}
.opt-text{flex:1}
.opt:active{transform:scale(.985);border-color:var(--navy-light)}
.opt.selected{
  border-color:var(--navy);
  background:rgba(30,58,138,.04);
  box-shadow:0 0 0 3px rgba(30,58,138,.1);
}

.nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:22px;
  padding-bottom:env(safe-area-inset-bottom);
}

.hidden{display:none}
.resultHero{text-align:center;padding:14px 0 4px}
.resultName{
  font-size:44px;
  font-weight:800;
  margin:8px 0;
  color:var(--navy);
  letter-spacing:-.02em;
}
.tag{
  display:inline-block;
  border-radius:999px;
  padding:6px 13px;
  margin:3px;
  font-size:12px;
  font-weight:500;
  color:var(--navy);
  background:linear-gradient(135deg,#eff6ff,#fef3c7);
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.dim{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
}
.dimtop{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.dimtop b{color:var(--navy)}
.track{height:8px;background:#e2e8f0;border-radius:8px;margin-top:9px;overflow:hidden}
.fill{
  height:100%;
  background:linear-gradient(90deg,var(--navy),var(--gold));
  border-radius:8px;
}

.report h2{
  font-size:18px;
  font-weight:700;
  margin-top:24px;
  color:var(--navy);
}
.report h2::before{
  content:'';
  display:inline-block;
  width:5px;height:15px;
  border-radius:2px;
  background:linear-gradient(180deg,var(--navy),var(--gold));
  margin-right:8px;
  vertical-align:-2px;
}
.report p{line-height:1.85;color:#334155;font-size:15px}
.report b{color:var(--navy)}

.cta-box{
  background:linear-gradient(135deg,#eff6ff,#fef3c7);
  border:1.5px solid #dbeafe;
  border-radius:18px;
  padding:22px 18px;
  margin-top:28px;
  text-align:center;
}
.cta-box h3{
  font-size:18px;
  font-weight:800;
  color:var(--navy);
  margin:0 0 10px;
}
.cta-box p{
  font-size:14px;
  color:#475569;
  line-height:1.7;
  margin:0 0 16px;
}
.cta-box .btn{margin:6px 4px}

.small{font-size:12px;color:var(--muted);line-height:1.7}
.foot{
  text-align:center;
  margin-top:24px;
  color:var(--muted);
  font-size:12px;
  padding-bottom:env(safe-area-inset-bottom);
  opacity:.85;
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .card{padding:20px 16px;border-radius:18px}
  h1{font-size:28px}
  .question{font-size:19px}
  .resultName{font-size:40px}
}
</style>
</head>
<body>
<div class="wrap">

<section id="intro" class="hero">
  <div class="kicker">STUDY ABROAD FIT TEST</div>
  <h1>你适合去哪个国家留学？</h1>
  <div class="sub">36 道题，从学术、职业、预算、独立、文化、节奏六个维度<br>帮你找到最匹配的留学方向。</div>
  <div style="margin-top:28px">
    <button class="btn" onclick="startTest()">开始测试</button>
  </div>
  <p class="small" style="margin-top:18px">测试结果仅供参考，具体选校需要结合个人情况综合评估。</p>
</section>

<section id="test" class="card hidden">
  <div class="qnum" id="qnum"></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="qtext" class="question"></div>
  <div id="opts"></div>
  <div class="nav">
    <button id="prev" class="btn secondary" onclick="prevQ()">上一题</button>
    <button id="next" class="btn" onclick="nextQ()">下一题</button>
  </div>
</section>

<section id="result" class="card hidden">
  <div class="resultHero">
    <div class="kicker">YOUR BEST MATCH</div>
    <div id="resultName" class="resultName"></div>
    <div id="resultTags"></div>
    <p id="resultDesc" class="sub"></p>
  </div>
  <div class="grid" id="dims"></div>
  <div class="report" id="report"></div>

  <div class="cta-box">
    <h3>想要更具体的选校建议？</h3>
    <p>测试只能看到大方向。真实的选校还要看你的专业、GPA、语言成绩和家庭预算。<br>我们的顾问可以帮你做一次一对一评估。</p>
    <button class="btn gold" onclick="handleConsult()">预约顾问评估</button>
  </div>

  <div style="text-align:center;margin-top:24px">
    <button class="btn secondary" onclick="restart()">重新测试</button>
  </div>
</section>

<div class="foot">本测试为机构自制内容，结果仅供留学方向参考。<br>具体选校需结合个人实际情况。</div>
</div>

let idx=0, answers=Array(QUESTIONS.length).fill(null);

function startTest(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('test').classList.remove('hidden');
  idx=0;
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q=QUESTIONS[idx];
  document.getElementById('qnum').textContent='第 '+(idx+1)+' / '+QUESTIONS.length+' 题';
  document.getElementById('bar').style.width=((idx+1)/QUESTIONS.length*100)+'%';
  document.getElementById('qtext').textContent=q.q;

  const box=document.getElementById('opts');
  box.innerHTML='';
  q.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(answers[idx]===i?' selected':'');
    b.innerHTML='<span class="opt-key">'+String.fromCharCode(65+i)+'</span>'
              + '<span class="opt-text">'+o.text+'</span>';
    b.onclick=()=>{ answers[idx]=i; renderQ(); };
    box.appendChild(b);
  });

  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').textContent =
    idx===QUESTIONS.length-1 ? '查看结果' : '下一题';
}

function prevQ(){ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0); } }

function nextQ(){
  if(answers[idx]===null){ alert('先选择一个答案哦。'); return; }
  if(idx<QUESTIONS.length-1){ idx++; renderQ(); window.scrollTo(0,0); }
  else showResult();
}

function calcScores(){
  const raw={A:0,C:0,B:0,I:0,X:0,P:0};
  answers.forEach((a,i)=>{
    const s=QUESTIONS[i].options[a].scores;
    KEYS.forEach(k=>{ raw[k]+=(s[k]||0); });
  });

  const maxP={A:0,C:0,B:0,I:0,X:0,P:0};
  const minP={A:0,C:0,B:0,I:0,X:0,P:0};
  const expP={A:0,C:0,B:0,I:0,X:0,P:0};
  QUESTIONS.forEach(q=>{
    KEYS.forEach(k=>{
      const vals=q.options.map(o=>o.scores[k]||0);
      maxP[k]+=Math.max.apply(null,vals);
      minP[k]+=Math.min.apply(null,vals);
      expP[k]+=vals.reduce((x,y)=>x+y,0)/vals.length;
    });
  });

  const out={};
  KEYS.forEach(k=>{
    const spanHigh=maxP[k]-expP[k];
    const spanLow=expP[k]-minP[k];
    let t;
    if(raw[k]>=expP[k]) t = spanHigh>0 ? (raw[k]-expP[k])/spanHigh : 0;
    else t = spanLow>0 ? -(expP[k]-raw[k])/spanLow : 0;
    out[k]=Math.round(Math.max(0,Math.min(100, 50+50*t)));
  });
  return out;
}

function centerShape(v){
  const m = KEYS.reduce((s,k)=>s+v[k],0)/KEYS.length;
  const o={};
  KEYS.forEach(k=>{ o[k]=v[k]-m; });
  return o;
}

function getResult(){
  const scores=calcScores();
  const uc=centerShape(scores);
  const ranked=FIGURES.map(f=>{
    const fc=centerShape(f.scores);
    let d=0;
    KEYS.forEach(k=>{ d+=Math.pow(uc[k]-fc[k],2); });
    return {f:f, d:Math.sqrt(d)};
  }).sort((a,b)=>a.d-b.d);
  return {scores:scores, best:ranked[0].f, second:ranked[1].f, third:ranked[2].f, ranked:ranked};
}

function showResult(){
  document.getElementById('test').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');

  const r=getResult(), f=r.best;
  document.getElementById('resultName').textContent=f.name;
  document.getElementById('resultDesc').textContent=f.desc;
  document.getElementById('resultTags').innerHTML =
    f.keywords.split(' / ').map(x=>'<span class="tag">'+x+'</span>').join('');

  const dims=document.getElementById('dims');
  dims.innerHTML='';
  KEYS.forEach(k=>{
    const d=document.createElement('div');
    d.className='dim';
    d.innerHTML='<div class="dimtop"><span>'+DIMS[k]+'</span><b>'+r.scores[k]+'</b></div>'
              + '<div class="track"><div class="fill" style="width:'+r.scores[k]+'%"></div></div>';
    dims.appendChild(d);
  });

  const sorted=Object.entries(r.scores).sort((a,b)=>b[1]-a[1]);
  const high=sorted.slice(0,2).map(x=>DIMS[x[0]]).join(' × ');
  const low =sorted.slice(-2).map(x=>DIMS[x[0]]).join(' × ');
  const sim = Math.max(60, Math.min(97, Math.round(100 - r.ranked[0].d * 1.2)));

  document.getElementById('report').innerHTML=
    '<h2>为什么是'+f.name+'？</h2>'
  + '<p>你在六个维度中最突出的是 <b>'+high+'</b>，相对偏弱的是 <b>'+low+'</b>。在模型里，你与'+f.name+'的匹配度约为 <b>'+sim+'%</b>。</p>'
  + '<p>'+f.name+'的核心特点是：'+f.desc+'。这与你当前呈现出来的偏好比较契合。</p>'
  + '<h2>你的第二、第三选择</h2>'
  + '<p>如果第一匹配不完全合适，你与 <b>'+r.second.name+'</b>、<b>'+r.third.name+'</b> 也有较高的匹配度，可以作为备选方向。</p>'
  + '<h2>留学申请建议</h2>'
  + '<p>'+adviceText(f.name, sorted)+'</p>';

  window.scrollTo(0,0);
}
